<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Question For You</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --plum: #241726;
    --plum-deep: #180e1a;
    --blush: #e7b3bd;
    --gold: #c9a24a;
    --paper: #fbf5ee;
    --ink: #382733;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--plum) 0%, var(--plum-deep) 70%);
    font-family: 'Jost', sans-serif;
    overflow: hidden;
  }
  .sky{
    position: fixed; inset:0; pointer-events:none; z-index:0;
  }
  .spark{
    position:absolute; border-radius:50%;
    background: var(--gold);
    opacity:.55;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform: scale(1); }
    50%{ opacity:.75; transform: scale(1.4); }
  }

  .stage{
    position: relative; z-index:1;
    height:100%; width:100%;
    display:flex; align-items:center; justify-content:center;
    flex-direction: column;
    padding: 24px;
  }

  .prompt{
    color: var(--blush);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.1rem, 2.6vw, 1.5rem);
    letter-spacing: .02em;
    margin-bottom: 34px;
    opacity: .85;
    text-align: center;
    transition: opacity .4s ease;
  }
  .prompt.hide{ opacity:0; height:0; margin:0; }

  /* Envelope */
  .envelope-wrap{
    position: relative;
    width: min(320px, 78vw);
    aspect-ratio: 3/2;
    cursor: pointer;
    perspective: 1200px;
    transition: transform .3s ease;
  }
  .envelope-wrap:hover{ transform: translateY(-4px); }
  .envelope-wrap.opened{ pointer-events:none; }

  .env-body{
    position:absolute; inset:0;
    background: linear-gradient(155deg, #3a2540, #2a1a2f);
    border: 1px solid rgba(201,162,74,.35);
    border-radius: 6px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .env-flap{
    position:absolute; top:0; left:0; right:0; height:52%;
    background: linear-gradient(155deg, #43293c, #301c34);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .7s cubic-bezier(.6,-0.2,.3,1.3);
    border-radius: 6px 6px 0 0;
    z-index: 3;
  }
  .env-flap::after{
    content:'';
    position:absolute; top:38%; left:50%; transform: translate(-50%,-50%);
    width: 26px; height: 26px; border-radius:50%;
    background: var(--gold);
    box-shadow: 0 0 12px rgba(201,162,74,.6);
  }
  .envelope-wrap.opened .env-flap{
    transform: rotateX(180deg);
    z-index: 1;
  }

  .letter{
    position:absolute;
    left: 6%; right:6%;
    bottom: 6%;
    height: 0%;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    overflow: hidden;
    z-index: 2;
    transition: height .6s cubic-bezier(.2,.7,.3,1.1) .35s, bottom .6s cubic-bezier(.2,.7,.3,1.1) .35s;
  }
  .envelope-wrap.opened .letter{
    height: 230%;
    bottom: 40%;
  }

  .hint{
    position:absolute; bottom: -34px; left:0; right:0;
    text-align:center;
    color: rgba(231,179,189,.6);
    font-size: .8rem;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  /* Card / question panel */
  .card{
    display:none;
    width: min(420px, 90vw);
    background: var(--paper);
    border-radius: 10px;
    padding: 40px 32px 32px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,.5);
    animation: rise .6s ease both;
  }
  .card.show{ display:block; }
  @keyframes rise{
    from{ opacity:0; transform: translateY(24px) scale(.97); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .card h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-style: italic;
    color: var(--ink);
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    margin: 0 0 10px;
    line-height: 1.15;
  }
  .card p.sub{
    color: #8a7681;
    font-size: .92rem;
    margin: 0 0 30px;
  }

  .choices{
    position: relative;
    display:flex;
    gap: 16px;
    justify-content:center;
    align-items:center;
    min-height: 60px;
  }

  button{
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    font-size: .95rem;
    border: none;
    border-radius: 999px;
    padding: 13px 30px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .yes{
    background: var(--ink);
    color: var(--paper);
    letter-spacing: .02em;
  }
  .yes:hover{ transform: translateY(-2px); box-shadow: 0 8px 18px rgba(56,39,51,.35); }

  .no{
    background: transparent;
    color: #a99aa3;
    border: 1px solid #ddd0d6;
    position: relative;
  }
  .no.dodging{
    position: absolute;
  }

  /* Picker (where to go) */
  .picker-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 4px;
  }
  .place{
    background: #f2e9e0;
    color: var(--ink);
    border: 1px solid rgba(56,39,51,.1);
    border-radius: 10px;
    padding: 16px 10px;
    font-size: .88rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 6px;
  }
  .place .emoji{ font-size: 1.4rem; }
  .place:hover{ background: #e9dcce; transform: translateY(-2px); }
  .place.picked{
    background: var(--ink);
    color: var(--paper);
  }

  /* Success state */
  .success{
    display:none;
  }
  .success.show{ display:block; }
  .success h1{ color: var(--ink); }
  .success .heart{
    font-size: 2.4rem;
    display:block;
    margin-bottom: 6px;
  }

  .confetti{
    position: fixed; top:-10px; font-size: 1.2rem;
    animation: fall linear forwards;
    z-index: 5;
  }
  @keyframes fall{
    to{ transform: translateY(105vh) rotate(360deg); opacity:.9; }
  }

  footer{
    position:absolute; bottom: 14px; left:0; right:0;
    text-align:center;
    color: rgba(231,179,189,.35);
    font-size: .7rem;
    letter-spacing: .1em;
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<div class="stage">
  <div class="prompt" id="prompt">you have a letter&hellip;</div>

  <div class="envelope-wrap" id="envelope" onclick="openEnvelope()">
    <div class="env-body"></div>
    <div class="letter"></div>
    <div class="env-flap"></div>
    <div class="hint">tap to open</div>
  </div>

  <div class="card" id="card">
    <h1>Would you like to go on a date&nbsp;with me?</h1>
    <p class="sub">No pressure &mdash; just an honest question.</p>
    <div class="choices" id="choices">
      <button class="yes" onclick="sayYes()">Yes, I'd love to</button>
      <button class="no" id="noBtn" onmouseover="dodge(event)" onclick="dodge(event)" ontouchstart="dodge(event)">Not for me</button>
    </div>
  </div>

  <div class="card" id="picker">
    <h1>Great &mdash; where should we go?</h1>
    <p class="sub">Pick whatever sounds good, I'm flexible.</p>
    <div class="picker-grid">
      <button class="place" onclick="pickPlace(this, 'coffee')"><span class="emoji">&#9749;</span>Coffee</button>
      <button class="place" onclick="pickPlace(this, 'dinner')"><span class="emoji">&#127860;</span>Dinner</button>
      <button class="place" onclick="pickPlace(this, 'a movie')"><span class="emoji">&#127916;</span>Movie</button>
      <button class="place" onclick="pickPlace(this, 'a walk outside')"><span class="emoji">&#127795;</span>A walk</button>
    </div>
  </div>

  <div class="card success" id="success">
    <span class="heart">&#10084;</span>
    <h1>That's the best answer.</h1>
    <p class="sub" id="successSub">I'll be in touch about when and where &mdash; can't wait.</p>
  </div>
</div>

<footer>made with a little courage</footer>

<script>
  // ambient sparks
  const sky = document.getElementById('sky');
  for(let i=0;i<28;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const size = Math.random()*3 + 1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*4)+'s';
    s.style.animationDuration = (3+Math.random()*3)+'s';
    sky.appendChild(s);
  }

  function openEnvelope(){
    const env = document.getElementById('envelope');
    if(env.classList.contains('opened')) return;
    env.classList.add('opened');
    document.getElementById('prompt').classList.add('hide');
    setTimeout(()=>{
      env.style.display = 'none';
      document.getElementById('card').classList.add('show');
    }, 950);
  }

  let dodgeCount = 0;
  function dodge(e){
    e.preventDefault();
    const btn = document.getElementById('noBtn');
    const choices = document.getElementById('choices');
    const rect = choices.getBoundingClientRect();
    btn.classList.add('dodging');

    const maxX = rect.width - btn.offsetWidth;
    const maxY = 40;
    const newX = Math.random()*maxX - maxX/2;
    const newY = (Math.random()*maxY) - maxY/2;

    btn.style.transform = `translate(${newX}px, ${newY}px)`;

    dodgeCount++;
    const phrases = ["Not for me","Try again?","Nope, still no","Almost had it","So close","Keep trying?"];
    btn.textContent = phrases[Math.min(dodgeCount, phrases.length-1)];
  }

  function sayYes(){
    document.getElementById('card').classList.remove('show');
    document.getElementById('picker').classList.add('show');
  }

  function pickPlace(btn, label){
    document.querySelectorAll('.place').forEach(p => p.classList.remove('picked'));
    btn.classList.add('picked');
    document.getElementById('successSub').textContent =
      `I'll be in touch about the details for ${label} \u2014 can't wait.`;
    setTimeout(()=>{
      document.getElementById('picker').classList.remove('show');
      document.getElementById('success').classList.add('show');
      burst();
    }, 450);
  }

  function burst(){
    const hearts = ['&#10084;','&#10084;&#65039;','&#128149;','&#10022;'];
    for(let i=0;i<40;i++){
      setTimeout(()=>{
        const c = document.createElement('div');
        c.className = 'confetti';
        c.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];
        c.style.left = Math.random()*100+'vw';
        c.style.animationDuration = (2.5+Math.random()*2)+'s';
        c.style.opacity = .6+Math.random()*.4;
        document.body.appendChild(c);
        setTimeout(()=>c.remove(), 5000);
      }, i*60);
    }
  }
</script>
</body>
</html>
